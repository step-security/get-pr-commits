name: 'get-pr-commits'
description: 'Reads the commits of the pull request a workflow is running on'
inputs:
  token:
    description: 'Token used to read the pull request, normally secrets.GITHUB_TOKEN'
    required: true
  filter_out_pattern:
    description: 'Commits whose message matches this regex are dropped. Empty means no filtering'
    required: false
    default: ""
  filter_out_flags:
    description: 'Flags applied to filter_out_pattern, for example i'
    required: false
    default: ''
outputs:
  commits:
    description: 'JSON array of the pull request commits, as returned by the GitHub API'
runs:
  using: 'node24'
  main: 'dist/index.js'
